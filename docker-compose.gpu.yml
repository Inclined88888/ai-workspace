# NVIDIA GPU override for Ollama. Requires the NVIDIA Container Toolkit on the host.
# Used automatically by setup.sh when nvidia-smi works, or manually:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
