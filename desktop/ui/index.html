<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Workspace</title>
  <style>
    :root { color-scheme: light dark; --bg: #0b0d12; --fg: #e8eaf0; --muted: #8a90a2; --accent: #7c5cff; --err: #ff6b6b; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f7fb; --fg: #14161c; --muted: #5d6475; } }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    main { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .mark { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
      background: conic-gradient(from 210deg, var(--accent), #35c8ff, #7cffb2, var(--accent));
      animation: breathe 2.4s ease-in-out infinite; }
    h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
    p { margin: 0; color: var(--muted); max-width: 520px; }
    p.err { color: var(--err); user-select: text; }
    .bar { width: 180px; height: 3px; border-radius: 3px; margin: 22px auto 0; background: color-mix(in srgb, var(--muted) 25%, transparent); overflow: hidden; }
    .bar::after { content: ""; display: block; height: 100%; width: 40%; border-radius: 3px; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
    .failed .bar, .failed .mark { animation: none; }
    .failed .bar { display: none; }
    @keyframes breathe { 50% { transform: scale(.92); filter: saturate(1.4); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .mark, .bar::after { animation: none; } }
  </style>
</head>
<body>
  <main id="root">
    <div>
      <div class="mark" aria-hidden="true"></div>
      <h1>AI Workspace</h1>
      <p id="status" role="status" aria-live="polite">Starting your workspace…</p>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </main>
  <script>
    // Called by the Rust shell (src-tauri/src/sidecars.rs) while the local backend starts.
    window.bootStatus = function (text, isError) {
      var el = document.getElementById("status");
      el.textContent = text;
      el.className = isError ? "err" : "";
      document.getElementById("root").classList.toggle("failed", !!isError);
    };
  </script>
</body>
</html>
