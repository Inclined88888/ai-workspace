<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Workspace</title>
  <style>
    /* Same tokens as workbench/frontend/src/styles.css. No network: system fonts and an inline SVG only. */
    :root {
      color-scheme: light dark;
      --bg: #f7f7f9; --text: #111116; --muted: #5f5f6b; --track: #e6e6eb;
      --accent: #5b57e8; --danger-text: #b42318; --danger-soft: #fef0ef; --glow: rgba(91, 87, 232, 0.16);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0a0c; --text: #ededf0; --muted: #a1a1ab; --track: #26262c;
        --accent: #6560f0; --danger-text: #ff8a80; --danger-soft: #2a1517; --glow: rgba(101, 96, 240, 0.22); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(520px 340px at 50% 42%, var(--glow), transparent 70%); }
    main { position: relative; height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; }
    .stack { display: flex; flex-direction: column; align-items: center; animation: rise 240ms var(--ease-out) both; }
    .mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff; margin-bottom: 20px;
      background: radial-gradient(120% 120% at 20% 0%, #8f8bff 0%, #5b57e8 45%, #3a2fb8 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.2), 0 10px 30px -8px rgba(91,87,232,.6);
      animation: breathe 2.4s ease-in-out infinite; }
    h1 { font-size: 20px; line-height: 28px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.015em; }
    p { margin: 0; color: var(--muted); max-width: 460px; min-height: 21px; }
    p.err { color: var(--danger-text); background: var(--danger-soft); padding: 8px 12px; border-radius: 8px;
      -webkit-user-select: text; user-select: text; margin-top: 4px; }
    .bar { width: 160px; height: 2px; border-radius: 2px; margin-top: 22px; background: var(--track); overflow: hidden; }
    .bar::after { content: ""; display: block; height: 100%; width: 40%; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.3s ease-in-out infinite; }
    .failed .mark { animation: none; filter: grayscale(.6); }
    .failed .bar { visibility: hidden; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.98); } }
    @keyframes breathe { 50% { transform: scale(.94); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      .stack, .mark, .bar::after { animation: none; }
      .bar::after { width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <main id="root">
    <div class="stack">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
          <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
        </svg>
      </div>
      <h1>AI Workspace</h1>
      <p id="status" role="status" aria-live="polite">Starting your workspace…</p>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </main>
  <script>
    // Called by the Rust shell (src-tauri/src/sidecars.rs) while the local backend starts.
    window.bootStatus = function (text, isError) {
      var el = document.getElementById("status");
      el.textContent = text;
      el.className = isError ? "err" : "";
      document.getElementById("root").classList.toggle("failed", !!isError);
    };
  </script>
</body>
</html>
