name: ROOKS v9.1 security checks

on:
  push:
    branches:
      - security/rooks-v9-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooks-v91-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check installer syntax and safety regressions
        run: |
          bash -n install.sh setup.sh
          python -m unittest discover -s tests -p 'test_installer.py' -v
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workbench/backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run backend security regressions and full suite
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
