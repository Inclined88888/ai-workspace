# Item 111. Runs on every pull request and every push to main. A failing job blocks "green".
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workbench/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"  # the image's Python (workbench/Dockerfile)
          cache: pip
          cache-dependency-path: |
            workbench/backend/requirements.txt
            workbench/backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Legacy database migration (schema v0 fixture from main 1a725f9)
        run: python -m pytest -q tests/test_actions.py -k migration
      - name: Full test suite
        run: python -m pytest -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workbench/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"  # the image's Node (workbench/Dockerfile)
          cache: npm
          cache-dependency-path: workbench/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm run build

  image:
    name: Image size, idle RAM and access log
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build, start, measure and check logs
        run: scripts/ci/check-image.sh
