[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rooks-browser"
version = "0.1.0"
description = "ai-workspace's AI browser agent: any model (OpenAI, Anthropic, OpenRouter, Ollama), your own Chrome or Edge, approvals before anything sensitive, every visited URL in a receipt"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
# One dependency. Playwright drives the Chrome or Edge you already have (or its own Chromium if you have neither).
# Model calls, search, the HTTP API and the MCP server are standard library.
dependencies = ["playwright>=1.48"]
classifiers = ["Environment :: Console", "Operating System :: OS Independent", "Topic :: Internet :: WWW/HTTP :: Browsers"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rooks-browser = "rooks_browser.cli:main"

[tool.setuptools]
packages = ["rooks_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
