# SearXNG config for internal use by Open WebUI and Workbench.
# It is not published to the host; only containers on the stack network reach it.
use_default_settings: true

general:
  instance_name: "AI Workspace Search"

search:
  safe_search: 0
  autocomplete: ""
  # json is required: Open WebUI and Workbench query /search?format=json
  formats:
    - html
    - json

server:
  # secret_key comes from the SEARXNG_SECRET environment variable
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
