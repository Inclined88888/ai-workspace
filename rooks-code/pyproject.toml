[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rooks-code"
version = "0.1.0"
description = "ai-workspace's terminal coding agent: any model (OpenAI, Anthropic, OpenRouter, Ollama, LM Studio), approvals, undo, budgets and receipts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only
classifiers = ["Environment :: Console", "Operating System :: OS Independent", "Topic :: Software Development"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rooks = "rooks_code.cli:main"

[tool.setuptools]
packages = ["rooks_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
