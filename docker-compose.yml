# AI Workspace: one light container by default. Everything else is an optional add-on (Compose profile).
# Run ./setup.sh for a guided first start. Add-ons: ./setup.sh --with search,browser,local-models,openwebui,paperclip,hermes,claude-code
#
#   Workspace (assistant, memory, skills, automations, company, notes, tasks, calendar, mail, research)
#             http://localhost:${WORKBENCH_PORT:-3100}
#   Add-ons: search (SearXNG), browser (Chromium agent), local-models (Ollama in Docker; on a Mac prefer the
#            native Ollama app), openwebui :3000, paperclip :3200, hermes :3300

name: ai-workspace

services:
  ollama:
    profiles: ["local-models"]
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    # Not published to the host by default. Uncomment to use Ollama from other tools.
    # ports:
    #   - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  searxng:
    profiles: ["search"]
    image: searxng/searxng:${SEARXNG_TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      # Bind IPv4: the image default (::) crashes on hosts with IPv6 disabled
      GRANIAN_HOST: 0.0.0.0

  open-webui:
    profiles: ["openwebui"]
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    restart: unless-stopped
    depends_on:
      - workbench
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      WEBUI_NAME: ${WORKSPACE_NAME:-AI Workspace}
      WEBUI_URL: ${WEBUI_PUBLIC_URL:-http://localhost:3000}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      # First account created becomes admin. Later sign ups wait for approval.
      ENABLE_SIGNUP: ${WEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: pending
      # Local models
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # External OpenAI compatible providers (semicolon separated, keys in the same order)
      # setup.sh fills these (cloud providers, plus Hermes when that add-on is on)
      ENABLE_OPENAI_API: ${WEBUI_ENABLE_OPENAI_API:-false}
      OPENAI_API_BASE_URLS: ${WEBUI_OPENAI_API_BASE_URLS:-}
      OPENAI_API_KEYS: ${WEBUI_OPENAI_API_KEYS:-}
      # Web search through the SearXNG add-on, when enabled
      ENABLE_WEB_SEARCH: ${WEBUI_ENABLE_WEB_SEARCH:-false}
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"
      # Memory and notes
      ENABLE_MEMORIES: "true"
      ENABLE_NOTES: "true"
      # Workbench tools (notes, tasks, calendar, mail drafts) callable from chat
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"openapi","url":"http://workbench:8000/tools","spec_type":"url","spec":"","path":"openapi.json",
        "auth_type":"bearer","key":"${TOOLS_API_KEY}","config":{"enable":true},
        "info":{"id":"workbench","name":"Workbench","description":"Notes, documents, tasks, calendar and email drafts"}},
        {"type":"openapi","url":"http://browser:8100/tools","spec_type":"url","spec":"","path":"openapi.json",
        "auth_type":"bearer","key":"${BROWSER_API_KEY}","config":{"enable":true},
        "info":{"id":"browser","name":"Browser","description":"A browser agent that can navigate websites to reach a goal"}}]

  workbench:
    build: ./workbench
    image: ai-workspace/workbench:local
    restart: unless-stopped
    extra_hosts:
      # Lets the workspace reach a native Ollama app on the host (OLLAMA_URL=http://host.docker.internal:11434)
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WORKBENCH_PORT:-3100}:8000"
    volumes:
      - workbench:/data
    environment:
      APP_SECRET: ${APP_SECRET:?run ./setup.sh or set APP_SECRET in .env}
      TOOLS_API_KEY: ${TOOLS_API_KEY:?run ./setup.sh or set TOOLS_API_KEY in .env}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-AI Workspace}
      WORKSPACE_TIMEZONE: ${WORKSPACE_TIMEZONE:-UTC}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:4b}
      # Context window requested from Ollama (tokens). More needs more RAM: about 2.4 GB of cache per 16K on a 4B model
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      # Add-ons: empty unless enabled by setup.sh --with ...
      CHAT_URL: ${CHAT_URL:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      # Set to true when Workbench is served over HTTPS (reverse proxy)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Seed external providers on first start (also editable in Settings)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CODEX_URL: ${CODEX_URL:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CLAUDE_CODE_URL: ${CLAUDE_CODE_URL:-}
      CLAUDE_CODE_API_KEY: ${CLAUDE_CODE_API_KEY:-}
      BROWSER_URL: ${BROWSER_URL:-}
      BROWSER_API_KEY: ${BROWSER_API_KEY:-}
      PAPERCLIP_URL: ${PAPERCLIP_URL:-}
      HERMES_URL: ${HERMES_URL:-}

  # Official CLI hand-off only; no subscription credentials enter Workbench.
  claude-code:
    profiles: ["claude-code"]
    build:
      context: ./cli-launcher
      dockerfile: Dockerfile.claude
    image: ai-workspace/claude-code-launcher:local
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Internal only; no host port, provider keys, Docker socket or host home mounts.
    volumes:
      - claude-code-auth:/home/node/.claude
      - claude-code-workspace:/workspace
    environment:
      LAUNCHER_API_KEY: ${CLAUDE_CODE_API_KEY:-}
      LAUNCHER_COMMAND: claude
      LAUNCHER_ARGS: '["--print", "--output-format", "text", "--no-session-persistence"]'
      LAUNCHER_AUTH_ARGS: '["auth", "status"]'
      LAUNCHER_AUTH_MATCH: '{"loggedIn":true,"authMethod":"claude.ai"}'
      LAUNCHER_CHILD_ENV: '{"CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC":"1","DISABLE_AUTOUPDATER":"1"}'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8110/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Official CLI hand-off only; no subscription credentials enter Workbench.
  codex:
    profiles: ["codex"]
    build:
      context: ./cli-launcher
      dockerfile: Dockerfile.codex
    image: ai-workspace/codex-launcher:local
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Internal only; no host port, provider keys, Docker socket or host home mounts.
    volumes:
      - codex-auth:/home/node/.codex
      - codex-workspace:/workspace
    environment:
      LAUNCHER_API_KEY: ${CODEX_API_KEY:-}
      LAUNCHER_COMMAND: node
      LAUNCHER_ARGS: '["/app/codex.mjs", "run"]'
      LAUNCHER_AUTH_ARGS: '["/app/codex.mjs", "auth"]'
      LAUNCHER_AUTH_MATCH: '{"authenticated":true}'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8110/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Browser agent (browser-use + Playwright). Internal only: reached by Workbench, Chat and Paperclip.
  browser:
    profiles: ["browser"]
    build: ./browser-agent
    image: ai-workspace/browser-agent:local
    depends_on:
      - workbench
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - browser:/data
    environment:
      BROWSER_API_KEY: ${BROWSER_API_KEY:-}
      BROWSER_MAX_CONCURRENT: ${BROWSER_MAX_CONCURRENT:-2}
      BROWSER_MAX_STEPS_LIMIT: ${BROWSER_MAX_STEPS_LIMIT:-50}
      # Spend guard for every caller (Workbench, Chat, Paperclip employees): steps per UTC month, 0 = unlimited
      BROWSER_MONTHLY_STEP_LIMIT: ${BROWSER_MONTHLY_STEP_LIMIT:-2000}
      # Keep the agent off IP addresses and the stack's own hostnames
      BROWSER_BLOCK_IP_ADDRESSES: "true"
      BROWSER_PROHIBITED_DOMAINS: localhost,ollama,searxng,open-webui,workbench,paperclip,browser
      # Models: every call goes through Workbench's /v1 endpoint and its adapter layer (R1). No provider keys here:
      # they stay in Workbench, and browser spend lands in Workbench's run log.
      WORKBENCH_URL: http://workbench:8000
      BROWSER_REQUIRE_WORKBENCH: "true"

  # Paperclip: run a company of AI agents (org chart, goals, tasks, per agent monthly budgets).
  # Upstream image, unmodified: upgrade with `docker compose pull paperclip && docker compose up -d paperclip`.
  paperclip:
    profiles: ["paperclip"]
    image: ghcr.io/paperclipai/paperclip:${PAPERCLIP_TAG:-latest}
    restart: unless-stopped
    pids_limit: 2048
    stop_grace_period: 90s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PAPERCLIP_PORT:-3200}:3100"
    volumes:
      - paperclip:/paperclip
      - ./paperclip/opencode.json:/etc/ai-workspace/opencode.json:ro
    environment:
      HOST: 0.0.0.0
      # Upstream telemetry/config.ts gives these precedence over file settings.
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3200}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-}
      BETTER_AUTH_SECRET: ${PAPERCLIP_AUTH_SECRET:-}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SECRET:-}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET:-}
      # OpenCode employees: local Ollama models + browser MCP from this config; Zen free models with OPENCODE_API_KEY
      OPENCODE_CONFIG: /etc/ai-workspace/opencode.json
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      BROWSER_API_KEY: ${BROWSER_API_KEY}
      TOOLS_API_KEY: ${TOOLS_API_KEY}
      # Claude Code, Codex and Gemini CLI employees use the standard provider keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # Hermes Agent (Nous Research): persistent memory, self written skills, scheduled jobs, subagents,
  # messaging (Telegram, Discord, Slack, ...). Upstream image, unmodified. All state lives in the volume.
  hermes:
    profiles: ["hermes"]
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: 1gb
    depends_on:
      - workbench
    ports:
      # Dashboard (memory, skills, cron, sessions, messaging setup), behind basic auth
      - "${BIND_ADDRESS:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-3300}:9119"
    volumes:
      - hermes:/opt/data
    environment:
      # OpenAI compatible API used by Chat and by Paperclip's hermes_gateway employees (internal only)
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:-}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:-}
      # Model keys (keys saved in the Hermes dashboard take precedence)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_API_KEY:-}
      # Read by the MCP server entries in config.yaml (scripts/hermes-config.sh)
      TOOLS_API_KEY: ${TOOLS_API_KEY}
      BROWSER_API_KEY: ${BROWSER_API_KEY}

volumes:
  codex-auth:
  codex-workspace:
  claude-code-auth:
  claude-code-workspace:
  ollama:
  open-webui:
  workbench:
  browser:
  paperclip:
  hermes:

