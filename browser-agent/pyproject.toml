[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "browser-agent"
version = "0.1.0"
description = "Give an AI agent a goal in plain English and let it drive a real browser. Built on browser-use."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  # Pinned exactly: browser-use changes its API between releases, and each Playwright release expects its own browser
  # build (an unpinned Playwright once pulled 1.64.1 against an installed 1248-less browser and broke 6 tests).
  # Upgrade: change both pins, run `pytest` (CI installs the matching browser), done.
  "browser-use==0.13.14",
  "playwright==1.64.1",
]

[project.optional-dependencies]
server = ["fastapi==0.162.0", "uvicorn[standard]==0.54.0"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[project.scripts]
browser-agent = "browser_agent.cli:main"
browser-agent-server = "browser_agent.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
