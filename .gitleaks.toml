# Gitleaks configuration for AI Workspace
# https://github.com/gitleaks/gitleaks

[allowlist]
# Test fixtures with REDACTED placeholder values
description = "Test fixtures with placeholder API keys"
files = [
    "(?i)test.*\\.py$",
    "(?i)test.*\\.ts$",
    "(?i)test.*\\.tsx$",
    "(?i)__tests__.*\\.ts$",
    "(?i)__tests__.*\\.tsx$",
]
# Allow placeholder patterns in test files
patterns = [
    '''["']?REDACTED["']?''',
    '''["']?<REDACTED>["']?''',
    '''["']?PLACEHOLDER["']?''',
    '''["']?FAKE_KEY["']?''',
    '''["']?TEST_KEY["']?''',
    '''["']?MOCK_KEY["']?''',
    '''["']?DUMMY["']?''',
]

# Specific known test file paths that use placeholder keys
paths = [
    "workbench/backend/tests/test_search_key.py",
    "workbench/backend/tests/test_route_auth.py",
    "workbench/backend/tests/test_discord.py",
    "workbench/backend/app/voice.py",
    "workbench/backend/tests/test_sites.py",
    "mobile/src/lib/__tests__/link.test.ts",
]

[rule.generic-api-key]
# Disable the generic API key rule for test files entirely
description = "Generic API key pattern - disabled for test files"
regex = '''[a-zA-Z0-9_-]{20,}'''
tags = ["key", "api"]
allowlist = true

# Other rules that may trigger on test fixtures
[rule.generic-secret]
description = "Generic secret pattern - disabled for test files"
regex = '''["']?(password|secret|token|key)["']?\s*[:=]\s*["']?[a-zA-Z0-9_\-]{8,}["']?'''
tags = ["secret"]
allowlist = true

[rule.generic-token]
description = "Generic token pattern - disabled for test files"
regex = '''["']?(token|api_key|secret_key)["']?\s*[:=]\s*["']?[a-zA-Z0-9_\-]{16,}["']?'''
tags = ["token"]
allowlist = true

# Keep important rules active
[rule.aws-access-key-id]
description = "AWS Access Key ID"
regex = '''(A3T|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "aws"]
allowlist = false

[rule.aws-secret-access-key]
description = "AWS Secret Access Key"
regex = '''[A-Za-z0-9/+=]{40}'''
tags = ["key", "aws"]
allowlist = false

[rule.github-pat]
description = "GitHub Personal Access Token"
regex = '''(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,251}'''
tags = ["token", "github"]
allowlist = false

[rule.slack-token]
description = "Slack Token"
regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''
tags = ["token", "slack"]
allowlist = false

# Stripe keys
[rule.stripe-api-key]
description = "Stripe API Key"
regex = '''sk_live_[0-9a-zA-Z]{24}'''
tags = ["key", "stripe"]
allowlist = false

[rule.stripe-publishable-key]
description = "Stripe Publishable Key"
regex = '''pk_live_[0-9a-zA-Z]{24}'''
tags = ["key", "stripe"]
allowlist = false